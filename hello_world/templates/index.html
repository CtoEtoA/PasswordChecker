{% load django_browser_reload %}
{% load static %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GitHub Codespaces ♥️ Django">
    <meta name="author" content="GitHub Codespaces">
    <meta name="generator" content="GitHub Codespaces">
    <meta name="theme-color" content="#000000">
    <title>{% block title %}{{ title }} | GitHub Codespaces ♥️ Django{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'main.css' %}">
</head>

<body class="App">
    <header class="App-header">
        <nav>
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Learn More</a></li>
            </ul>
        </nav>
    </header>

    <!-- Title Section -->
    <section class="Title">
        <h1>{{ title }}</h1>
        <h2>{{ subtitle }}</h2>
        <p> {{ description}}</p>
    </section>

    <!-- Form Section -->
    <section class="Form">
        <form>
            <label for="name">Check your password:</label>
            <input type="username" id="password" name="password" placeholder="password">
            <button type="submit">Submit Password</button>
        </form>
    </section>

    <section>

    </section>

    <footer class="App-header">
        <nav>
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Learn More</a></li>
            </ul>
        </nav>
    </footer>
</body>

</html>
